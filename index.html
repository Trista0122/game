<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0520'/%3E%3Cpath d='M34 9 L56 51 H12 Z' fill='none' stroke='%232ef2ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M5 38 H38 M9 46 H30' stroke='%23ff3fb4' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Layout: one full-bleed canvas stage. HUD rides the sky band, touch controls sit in the bottom corners;
   in phone portrait the stage shrinks to the top and a control pad fills the bottom. */
:root{
  --void:#08041a;
  --night:#140a33;
  --ink:#f1ecff;
  --mute:#a79ed0;
  --cyan:#2ef2ff;
  --magenta:#ff3fb4;
  --violet:#9b5cff;
  --amber:#ffc65a;
  --panel:rgba(13,7,36,.86);
  --line:rgba(150,120,255,.32);
  --display:"Bahnschrift SemiCondensed","Bahnschrift","DIN Condensed","Avenir Next Condensed","Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:max(10px,env(safe-area-inset-top,0px));
  --gb:max(12px,env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--void);touch-action:none}
#view{position:absolute;left:0;top:0;width:100%;height:100%}
#cv{display:block;width:100%;height:100%;outline:none}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.55}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;
  padding:var(--gt) var(--gr) 0 var(--gl);pointer-events:none;font-family:var(--display);text-shadow:0 0 10px rgba(46,242,255,.35)}
.hud-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.pos{display:flex;align-items:baseline;gap:2px;line-height:.9}
.pos b{font-size:46px;font-weight:700;color:var(--ink);font-style:italic;text-shadow:0 0 14px rgba(255,63,180,.7)}
.pos span{font-size:18px;color:var(--mute)}
.lapline{display:flex;gap:10px;align-items:baseline;font-size:15px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.lapline b{color:var(--cyan);font-size:20px;font-weight:600}
.tm{font:600 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.tm small{color:var(--mute);font-weight:400}
#hDelta{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
#hDelta.ahead{color:#5dffa8}#hDelta.behind{color:#ff6b8a}
.hud-c{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px}
.spd{display:flex;align-items:baseline;gap:4px;line-height:1}
.spd b{font:700 34px var(--display);font-style:italic;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.spd small{font-size:13px;color:var(--mute);letter-spacing:.08em}
.nit{position:relative;width:170px;height:12px;transform:skewX(-20deg);border:1px solid rgba(46,242,255,.55);background:rgba(10,5,30,.6);overflow:hidden}
.nit i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(.25);background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 12px var(--cyan)}
.nit.full{border-color:var(--cyan);box-shadow:0 0 14px rgba(46,242,255,.7)}
.nit.on i{background:linear-gradient(90deg,var(--magenta),#fff)}
.nit.chg{border-color:#fff;box-shadow:0 0 16px rgba(46,242,255,.9);animation:chg .25s steps(2) infinite}
@keyframes chg{50%{border-color:var(--cyan)}}
.nit-l{font-size:11px;letter-spacing:.22em;color:var(--mute)}
.pchip{font:700 11px var(--body);letter-spacing:.14em;color:#0a0520;background:var(--amber);padding:2px 8px;border-radius:999px;box-shadow:0 0 12px rgba(255,198,90,.6)}
.hud-r{display:flex;justify-content:flex-end;align-items:flex-start;gap:10px}
#mm{width:120px;height:120px;display:block}
#bPause{pointer-events:auto;width:44px;height:44px;border:1px solid var(--line);background:rgba(13,7,36,.6);border-radius:10px;display:grid;place-items:center}
#bPause svg{width:18px;height:18px}

#cmsg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;font:italic 700 64px var(--display);letter-spacing:.04em;
  color:var(--ink);text-shadow:0 0 18px var(--magenta),0 0 40px rgba(155,92,255,.8);opacity:0;transition:opacity .25s}
#cmsg.show{opacity:1}
#cmsg.small{font-size:30px;top:24%;text-shadow:0 0 16px var(--cyan)}
#toast{position:absolute;left:50%;top:calc(var(--gt) + 96px);transform:translate(-50%,20px);max-width:min(92vw,460px);padding:10px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none}
.tbtn{pointer-events:auto;position:absolute;width:88px;height:88px;border-radius:50%;border:2px solid rgba(46,242,255,.55);background:rgba(12,6,34,.38);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 13px var(--body);letter-spacing:.04em;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);touch-action:none}
.tbtn svg{width:30px;height:30px}
.tbtn.on{background:rgba(46,242,255,.32);box-shadow:0 0 22px rgba(46,242,255,.7)}
.tbtn.nitro{border-color:rgba(255,63,180,.7);width:76px;height:76px}
.tbtn.nitro.on{background:rgba(255,63,180,.38);box-shadow:0 0 22px rgba(255,63,180,.8)}
.tbtn.nitro.empty{opacity:.45}
.tb-dl{left:calc(var(--gl) + 4px);bottom:calc(var(--gb) + 6px)}
.tb-dr{right:calc(var(--gr) + 4px);bottom:calc(var(--gb) + 6px)}
.tb-n{right:calc(var(--gr) + 10px);bottom:calc(var(--gb) + 112px)}
.steer-hint{position:absolute;top:50%;transform:translateY(-50%);font:700 30px var(--display);color:rgba(46,242,255,.35);pointer-events:none;transition:opacity .6s}
.steer-hint.l{left:calc(var(--gl) + 8px)}.steer-hint.r{right:calc(var(--gr) + 8px)}
.steer-hint.on{color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
.padbg{display:none}
#app.portrait #touch{top:var(--vh)}
#app.portrait .padbg{display:grid;position:absolute;inset:0;grid-template-columns:1fr 1fr;gap:10px;padding:14px var(--gr) calc(var(--gb) + 8px) var(--gl);
  background:linear-gradient(180deg,#0f0730,#07031a)}
.padbg div{border:1px solid var(--line);border-radius:18px;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;
  font:700 44px var(--display);color:rgba(46,242,255,.4);background:rgba(155,92,255,.06)}
.padbg div.on{background:rgba(46,242,255,.16);color:var(--cyan)}
#app.portrait .steer-hint{display:none}
#app.portrait .tb-dl{bottom:calc(var(--gb) + 18px);left:calc(var(--gl) + 10px)}
#app.portrait .tb-dr{bottom:calc(var(--gb) + 18px);right:calc(var(--gr) + 10px)}
#app.portrait .tb-n{right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 24px)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:var(--gt) var(--gr) var(--gb) var(--gl);touch-action:pan-y}
.btn-hero{position:relative;border:0;padding:20px 46px;font:italic 700 26px var(--display);letter-spacing:.06em;color:#0a0520;text-transform:uppercase;
  background:linear-gradient(100deg,var(--cyan),#b6a0ff 55%,var(--magenta));clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
  box-shadow:0 0 30px rgba(46,242,255,.5);transition:transform .12s,filter .12s}
.btn-hero:hover{filter:brightness(1.12)}
.btn-hero:active{transform:scale(.97)}
.btn-hero.sm{padding:14px 30px;font-size:20px}
.btn{border:1px solid var(--line);background:rgba(155,92,255,.10);padding:11px 18px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--cyan)}
.btn-ghost{border:1px solid var(--line);background:transparent;padding:8px 16px;border-radius:999px;color:var(--mute)}
.chip{position:absolute;z-index:25;top:var(--gt);right:var(--gr);border:1px solid var(--line);background:rgba(13,7,36,.6);border-radius:999px;padding:6px 12px;font:600 13px var(--body);letter-spacing:.05em}

/* title */
.title{justify-content:flex-end;gap:26px;padding-bottom:calc(var(--gb) + 7vh);
  background:linear-gradient(180deg,rgba(8,4,26,0) 40%,rgba(8,4,26,.65) 100%)}
.brand{display:flex;align-items:center;gap:18px}
.mark{width:clamp(56px,9vw,92px);height:auto;filter:drop-shadow(0 0 12px rgba(46,242,255,.7))}
.logo{margin:0;display:flex;flex-direction:column;line-height:.92;transform:skewX(-9deg)}
.logo .lm{font:italic 800 clamp(48px,9.5vw,108px) var(--display);letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 10%,#b9f9ff 45%,var(--magenta) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,63,180,.55))}
.logo .ls{font:600 clamp(13px,1.9vw,19px) var(--display);letter-spacing:.55em;color:var(--cyan);margin-top:8px;padding-left:4px}
.title .btn-hero{align-self:flex-start;font-size:clamp(24px,3.4vw,34px);padding:clamp(18px,2.4vw,26px) clamp(44px,6vw,72px);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 46px rgba(255,63,180,.7)}}

/* tutorial */
.tutor{justify-content:center;align-items:center;gap:18px;background:rgba(6,3,20,.84);text-align:center;overflow-y:auto}
.tutor h2{margin:0;font:italic 700 30px var(--display);letter-spacing:.04em}
.tut-grid{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:14px;width:100%;justify-content:center}
.tut{margin:0;padding:16px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(155,92,255,.07);display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.tut figcaption{display:flex;flex-direction:column;gap:4px}
.tut figcaption b{font:700 18px var(--display);letter-spacing:.05em;color:var(--cyan)}
.tut figcaption span{color:var(--mute);font-size:13px}
.ill{height:74px;display:flex;align-items:center;justify-content:center;gap:6px}
kbd{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border:1px solid rgba(46,242,255,.6);border-bottom-width:4px;border-radius:8px;
  font:700 16px var(--mono);color:var(--ink);background:#150b38}
kbd.wide{min-width:120px}
.blink{animation:kb 1.2s steps(1) infinite}.blink.d2{animation-delay:.6s}
@keyframes kb{0%{background:#150b38}50%{background:var(--cyan);color:#0a0520}}
.phone{width:112px;height:62px;border:2px solid var(--mute);border-radius:10px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.phone i{animation:half 1.6s steps(1) infinite}
.phone i+i{animation-delay:.8s}
@keyframes half{0%{background:rgba(46,242,255,.45)}50%{background:transparent}}
.rb{width:60px;height:60px;border-radius:50%;border:2px solid var(--cyan);display:grid;place-items:center;font-weight:700;font-size:13px;animation:kb 1.2s steps(1) infinite}
.rb.n{border-color:var(--magenta)}
.tut-note{margin:0;color:var(--ink);max-width:46ch}
.tut-bar{width:min(420px,80vw);height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.tut-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--magenta))}

/* setup */
.setupS{background:rgba(6,3,20,.80);overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center}
.setup{width:100%;max-width:980px;display:flex;flex-direction:column;gap:12px;padding-block:44px 8px}
.setup-h{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.setup h3{margin:4px 0 0;font:600 12px var(--body);letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 16px;font-weight:600;color:var(--mute)}
.seg button.sel{background:linear-gradient(100deg,rgba(46,242,255,.25),rgba(155,92,255,.3));color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#trackCards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(20,10,51,.7);display:flex;gap:12px;align-items:center;min-width:0}
.card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(46,242,255,.35)}
.card canvas{flex:none;width:72px;height:72px;border-radius:10px}
.card .ct{display:flex;flex-direction:column;gap:3px;min-width:0}
.card b{font:700 18px var(--display);letter-spacing:.03em}
.card .cd{font-size:12px;color:var(--mute);line-height:1.35}
.card .cp{font-size:12px;color:var(--amber);line-height:1.35}
.card .cr{font:600 12px var(--mono);color:var(--cyan);font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:11px;color:var(--mute);width:100%}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.go-row{position:sticky;bottom:0;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-top:6px;padding-block:10px calc(var(--gb) + 2px);background:linear-gradient(180deg,rgba(8,4,26,0),rgba(8,4,26,.92) 30%)}
.go-row p{margin:0;color:var(--mute);font-size:13px;flex:1 1 220px}

/* panels */
.center{justify-content:center;align-items:center;background:rgba(6,3,20,.72);overflow-y:auto}
.panel{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 50px rgba(155,92,255,.25);margin:auto 0}
.panel h2{margin:0 0 4px;font:italic 700 30px var(--display)}
.panel p{margin:0;color:var(--mute)}
.panel .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{width:min(520px,100%);gap:12px}
.r-top{display:flex;align-items:center;gap:16px}
.r-pos{font:italic 800 76px/0.9 var(--display);color:var(--ink);text-shadow:0 0 20px var(--magenta)}
.r-pos small{font-size:24px;color:var(--mute)}
.r-label{font:700 22px var(--display);letter-spacing:.06em;color:var(--cyan)}
.r-meta{color:var(--mute);font-size:13px}
.r-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r-stats div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.r-stats span{font-size:12px;color:var(--mute);letter-spacing:.06em}
.r-stats b{font:700 24px var(--mono);font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--magenta);color:#14051d;font-weight:700;font-size:12px;letter-spacing:.08em}
.r-cols{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}
.r-cols h4{margin:0 0 4px;font-size:11px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.r-list{list-style:none;margin:0;padding:0;font:13px var(--mono);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.r-list li{display:flex;justify-content:space-between;gap:8px}
.r-list li.me{color:var(--cyan);font-weight:700}
.r-list li.best{color:#5dffa8}
.r-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#shareBox textarea{width:100%;height:76px;margin-top:6px;background:#0b0624;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px var(--body);-webkit-user-select:text;user-select:text}

.contents{display:contents}
.panel,.panel>*{flex-shrink:0}
.go-row.net-panel{position:static;background:none;padding-block:4px}
.setup-h{order:-2}.go-row.net-panel{order:-1}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
.net-panel{align-items:center}
.join{display:flex;gap:8px;align-items:center}
.join input{width:7.2em;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0b0624;color:var(--ink);font:700 18px var(--mono);letter-spacing:.18em;text-transform:uppercase}
.join input:focus{outline:2px solid var(--cyan);outline-offset:1px}
.net-msg{margin:0;color:var(--amber);font-size:13px;flex:1 1 100%;min-height:1em}
.net-note{margin:0;color:var(--mute);font-size:12px;flex:1 1 100%;line-height:1.45;-webkit-user-select:text;user-select:text}
.lobby{width:min(520px,100%);gap:8px}
.lobby h4{margin:6px 0 0;font-size:11px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.lb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.code{font:700 30px var(--mono);letter-spacing:.16em;color:var(--cyan);text-shadow:0 0 12px rgba(46,242,255,.6);-webkit-user-select:text;user-select:text}
.lb-players{font-size:14px;gap:5px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.seg.wrap{flex-wrap:wrap}
.ai-cnt{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;letter-spacing:.08em}
#aiSeg button,#lbAI button{padding:9px 11px;min-width:2.4em}
.seg button:disabled{cursor:default;opacity:.75}
.seg button:disabled.sel{opacity:1}
.tog{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin-top:4px}
.tog input{width:18px;height:18px;accent-color:#2ef2ff}
@media (max-height:500px){
  .lobby{gap:5px}.code{font-size:24px}.lobby .net-note{display:none}
  .pos b{font-size:34px}.spd b{font-size:26px}.nit{width:130px;height:10px}#mm{width:82px;height:82px}
  .title{gap:14px;padding-bottom:calc(var(--gb) + 4vh)}
  .tutor{gap:10px}.tutor h2{font-size:22px}.ill{height:56px}.tut{padding:10px 8px;gap:6px}
  #trackCards{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}#trackCards .card{gap:8px}#trackCards .cd{display:none}#trackCards canvas{width:40px;height:40px}
  .setup{gap:8px;padding-block:38px 0}.card{padding:8px}#carCards .cd{display:none}.go-row{padding-block:6px 4px}.card canvas{width:52px;height:52px}.card b{font-size:15px}
  .r-pos{font-size:56px}.panel{padding:16px;gap:8px}.result{gap:8px}
  .tbtn{width:76px;height:76px}.tbtn.nitro{width:66px;height:66px}.tb-n{bottom:calc(var(--gb) + 92px)}
}
@media (max-width:640px){
  .tut-grid{grid-template-columns:1fr;max-width:360px}
  .tut{flex-direction:row;text-align:left;padding:10px 12px}.ill{height:auto;min-width:118px}
  .cards{grid-template-columns:1fr}
  .card canvas{width:56px;height:56px}
  #hud{gap:6px}.pos b{font-size:32px}.spd b{font-size:24px}.nit{width:100px}#mm{width:72px;height:72px}#bPause{width:38px;height:38px}
  .r-cols{grid-template-columns:1fr}
}
@media (max-width:640px) and (max-height:500px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-height:500px) and (min-width:641px){.tut-grid{grid-template-columns:repeat(3,minmax(0,200px))}.tut{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv" tabindex="-1" aria-label="race view"></canvas>
    <div id="hud" hidden>
      <div class="hud-l">
        <div class="pos" id="hPosWrap"><b id="hPos">8</b><span id="hPosOf">/8</span></div>
        <div class="lapline"><span data-i="lap">圈</span><b id="hLap">1/3</b></div>
        <div class="tm" id="hTime">0:00.00</div>
        <div id="hDelta"></div>
      </div>
      <div class="hud-c">
        <div class="spd"><b id="hSpd">0</b><small>KM/H</small></div>
        <div class="nit" id="hNitWrap"><i id="hNit"></i></div>
        <div class="nit-l">NITRO</div>
        <div class="pchip" id="hPassive" hidden></div>
      </div>
      <div class="hud-r">
        <canvas id="mm" width="240" height="240" aria-hidden="true"></canvas>
        <button id="bPause" aria-label="Pause"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" fill="#f1ecff"/><rect x="11" y="2" width="4" height="14" fill="#f1ecff"/></svg></button>
      </div>
    </div>
    <div id="cmsg"></div>
  </div>

  <div id="touch" hidden>
    <div class="padbg"><div id="padL">◀</div><div id="padR">▶</div></div>
    <div class="steer-hint l" id="hintL">◀</div>
    <div class="steer-hint r" id="hintR">▶</div>
    <button class="tbtn drift tb-dl" data-act="drift" aria-label="drift / brake"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 24 C 8 12, 18 8, 26 9" fill="none" stroke="#2ef2ff" stroke-width="3" stroke-linecap="round"/><path d="M21 4 L27 9 L21 14" fill="none" stroke="#2ef2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i="bDrift">漂移</span></button>
    <button class="tbtn drift tb-dr" data-act="drift" aria-label="drift / brake"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 24 C 24 12, 14 8, 6 9" fill="none" stroke="#2ef2ff" stroke-width="3" stroke-linecap="round"/><path d="M11 4 L5 9 L11 14" fill="none" stroke="#2ef2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i="bDrift">漂移</span></button>
    <button class="tbtn nitro tb-n" data-act="nitro" aria-label="nitro"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M18 3 L8 18 H15 L13 29 L24 13 H17 Z" fill="#ff3fb4"/></svg><span data-i="bNitro">氮气</span></button>
  </div>

  <section id="scrTitle" class="screen title">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ef2ff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient></defs><path d="M34 7 L58 53 H10 Z" fill="none" stroke="url(#mg)" stroke-width="4.5" stroke-linejoin="round"/><path d="M34 7 L30 53" stroke="#2ef2ff" stroke-width="2" opacity=".6"/><path d="M2 38 H40 M8 46 H30" stroke="#ff3fb4" stroke-width="4" stroke-linecap="round"/></svg>
      <h1 class="logo"><span class="lm" id="logoMain">棱光漂移</span><span class="ls" id="logoSub">DRIFT PRISM</span></h1>
    </div>
    <button id="bStart" class="btn-hero"><span data-i="start">开始比赛</span></button>
  </section>

  <section id="scrTut" class="screen tutor" hidden>
    <h2 data-i="tutTitle">只有三个操作</h2>
    <div class="tut-grid" id="tutGrid"></div>
    <p class="tut-note" data-i="tutAuto"></p>
    <div class="tut-bar"><i id="tutProg"></i></div>
    <button id="bSkip" class="btn-ghost" data-i="skip">跳过</button>
  </section>

  <section id="scrSetup" class="screen setupS" hidden>
    <div class="setup">
      <div class="setup-h">
        <div class="seg" id="modeSeg"><button data-mode="race" data-i="modeRace">比赛</button><button data-mode="tt" data-i="modeTT">计时挑战</button><button data-mode="online" data-i="modeOnline">联机</button></div>
        <div class="ai-cnt" id="aiWrap"><span data-i="aiCount">AI 车数</span><div class="seg" id="aiSeg"></div></div>
        <div class="seg" id="diffSeg"><button data-d="0" data-i="d0">简单</button><button data-d="1" data-i="d1">普通</button><button data-d="2" data-i="d2">困难</button></div>
      </div>
      <div id="trackSec" class="contents"><h3 data-i="track">赛道</h3>
      <div class="cards" id="trackCards"></div></div>
      <h3 data-i="car">赛车</h3>
      <div class="cards" id="carCards"></div>
      <div class="go-row" id="goRow">
        <button id="bGo" class="btn-hero"><span data-i="go">出发</span></button>
        <p id="setupNote"></p>
      </div>
      <div class="go-row net-panel" id="onlinePanel" hidden>
        <button id="bHost" class="btn-hero"><span data-i="netHost">创建房间</span></button>
        <div class="join"><input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="room code"><button id="bJoin" class="btn" data-i="netJoin">加入</button></div>
        <p id="netMsg" class="net-msg"></p>
        <p id="netNote" class="net-note"></p>
      </div>
    </div>
  </section>

  <section id="scrPause" class="screen center" hidden>
    <div class="panel">
      <h2 data-i="paused">已暂停</h2>
      <p id="pauseNote"></p>
      <button id="bResume" class="btn-hero sm"><span data-i="resume">继续</span></button>
      <div class="row"><button id="bRestart" class="btn" data-i="restart">重新开始</button><button id="bMenu" class="btn" data-i="menu">返回菜单</button><button id="bNetLeave" class="btn" data-i="netLeave" hidden>离开房间</button></div>
      <div class="row"><button id="bSnd" class="btn"></button><button id="bMus" class="btn"></button></div>
      <button id="bFs" class="btn" data-i="fs" hidden>全屏</button>
    </div>
  </section>

  <section id="scrResult" class="screen center" hidden>
    <div class="panel result">
      <div class="r-top"><div class="r-pos" id="rPos">1</div><div><div class="r-label" id="rLabel"></div><div class="r-meta" id="rMeta"></div></div></div>
      <div class="r-stats"><div><span data-i="total">总用时</span><b id="rTotal"></b></div><div><span data-i="bestLap">最佳圈</span><b id="rBest"></b></div></div>
      <div id="rBadge" class="badge" hidden></div>
      <div class="r-cols">
        <div><h4 data-i="lapTimes">每圈用时</h4><ol class="r-list" id="rLaps"></ol></div>
        <div id="rStandWrap"><h4 data-i="standings">名次</h4><ol class="r-list" id="rStand"></ol></div>
      </div>
      <div class="r-btns"><button id="bBackRoom" class="btn-hero sm" hidden><span data-i="netBack">回到房间</span></button><button id="bAgain" class="btn-hero sm"><span data-i="again">再来一局</span></button><button id="bShare" class="btn" data-i="share">分享</button><button id="bChange" class="btn" data-i="change">换赛道</button></div>
      <div id="shareBox" hidden><p data-i="copyManual"></p><textarea id="shareTxt" readonly></textarea></div>
    </div>
  </section>

  <section id="scrLobby" class="screen center" hidden>
    <div class="panel lobby">
      <div class="lb-head"><h2><span data-i="netRoom">房间</span> <b id="lbCode" class="code">-----</b></h2><button id="bInvite" class="btn" data-i="netInvite">邀请朋友</button></div>
      <ol id="lbPlayers" class="r-list lb-players"></ol>
      <h4 data-i="netTrack">赛道</h4><div class="seg wrap" id="lbTrack"></div>
      <h4 data-i="lbDiff">AI 难度</h4><div class="seg wrap" id="lbDiff"></div>
      <h4 data-i="aiCount">AI 车数</h4><div class="seg wrap" id="lbAI"></div>
      <h4 data-i="netYourCar">你的赛车</h4><div class="seg wrap" id="lbCar"></div>
      <p id="lbStatus" class="net-msg"></p>
      <div class="r-btns"><button id="bLbStart" class="btn-hero sm"><span data-i="netStart">开始比赛</span></button><button id="bLbLeave" class="btn" data-i="netLeave">离开房间</button></div>
      <p class="net-note" data-i="netTip"></p>
      <p class="net-note" id="lbPrivacy" data-i="netPrivacy"></p>
    </div>
  </section>

  <button id="bLang" class="chip" aria-label="Language">EN</button>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

/* ---------------- colors / fog ---------------- */
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function mix(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b); return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'; }
function fogTable(c,fog){ const a=[]; for(let i=0;i<FOGN;i++) a.push(mix(c,fog,i/(FOGN-1))); return a; }

/* ---------------- offscreen art ---------------- */
function mk(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h); return c; }
function shade(hex,amt){ const c=hex2rgb(hex); const f=v=>Math.round(clamp(amt<0?v*(1+amt):v+(255-v)*amt,0,255)); return 'rgb('+f(c[0])+','+f(c[1])+','+f(c[2])+')'; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function pth(g,pts){ g.beginPath(); g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.closePath(); }

function freeLine(obs,tx,cx,hc,roadW,c,key,lo,hi){ if(lo==null){ lo=-.88; hi=.88; }

function onPlayerLap(lt,li){

  const rec=G.rec; let isBest=false;

    const gh={t:lt,car:G.carI,dt:.05,d:rec.d.slice(),x:rec.x.slice()}; ghosts[tid]=gh; store.set('ghost7_'+tid,gh); store.set('best7',best); }
  else if(!b.lap||lt<b.lap){ b.lap=lt; store.set('best7',best); }
  G.rec={d:[],x:[],lap:li};
  if(li<LAPS){ FX.event('lap',li); if(isBest) setTimeout(()=>centerMsg(t('newBest'),1600,true),900); if(li===LAPS-1) centerMsg(t('lastLap'),1800,true); }
}

  else if(G.mode==='tt'){ if(!b.tt||total<b.tt){ rec=true; b.tt=total; } }
  store.set('best7',best);

function standings(){ return G.cars.slice().sort((a,b)=>{ const ta=carT(a), tb=carT(b); return (ta!=null&&tb!=null)?ta-tb:ta!=null?-1:tb!=null?1:b.dist-a.dist; }); }

function simStep(dt){
  for(const c of G.cars){ if(c.ghostT>0) c.ghostT=Math.max(0,c.ghostT-dt);
    if(c.remote){ remoteStep(c,dt); continue; }
    if(c.wreckT>0){ c.wreckT-=dt; c.speed=0; if(c.wreckT<=0) respawn(c); continue; }

/* When the last human crosses the line, the rest of the race is simulated on a copy of the field (same AI and physics,

  const cl=G.cars.map(c=>Object.assign({},c,{got:new Set(c.got),laps:c.laps.slice(),remote:false,auto:true}));
  G.ffJob={cars:cl,player:cl[G.cars.indexOf(G.player)],raceT:G.raceT,time:G.time,fo:G.finishOrder.slice(),lim:G.raceT+180,track:G.track};

  const keep={cars:G.cars,player:G.player,raceT:G.raceT,time:G.time,fo:G.finishOrder,shake:G.shake};
  G.cars=J.cars; G.player=J.player; G.raceT=J.raceT; G.time=J.time; G.finishOrder=J.fo; G.ff=true;
  const pending=c=>!c.finished&&!c.human&&!c.isPlayer; const t0=performance.now(); let done=false;

function update(dt){
  G.time+=dt; const tr=G.track; if(!tr) return;
  if(G.state==='countdown'){
    G.countT-=dt; const n=Math.ceil(G.countT);
    if(n<G.lastBeep&&n>0){ G.lastBeep=n; centerMsg(String(n),900); AU.beep(false); }
    if(G.countT<=0){ G.state='race'; G.raceT=0; centerMsg('GO!',800); AU.beep(true); }
    return;
  }
  if(G.state==='race'||G.state==='finished'||G.state==='title'){
    G.raceT+=dt;
    simStep(dt);
    if(G.mode==='online'&&NET.on&&NET.host&&!G.ffDone&&G.state!=='title'&&G.cars.some(c=>c.human)&&G.cars.filter(c=>c.human).every(c=>c.finished)) G.needFF=true;
    if(G.needFF){ G.needFF=false; G.ffDone=true; ffStart(); }
    const p=G.player, ps=segOf(p.z);
    G.bgOff+=ps.curve*p.speed*dt/SEG*.0016;
    if(G.state==='race'){
      const r=G.rec, lt=G.raceT-p.lapStartT;
      if(r&&lt>=r.d.length*.05&&r.d.length<6000){ r.d.push(Math.round(p.dist-p.lapsDone*tr.len)); r.x.push(Math.round(p.x*1000)); }
    }
    if(G.ghost&&G.state==='race'){ const gh=G.ghost, d=gh.data, lt=G.raceT-p.lapStartT, f=lt/d.dt, k=Math.floor(f);
      if(k<d.d.length-1){ const u=f-k; gh.dist=lerp(d.d[k],d.d[k+1],u)+p.lapsDone*tr.len; gh.x=lerp(d.x[k],d.x[k+1],u)/1000; gh.z=mod(gh.dist,tr.len); gh.vis=true; gh.steer=clamp((d.x[k+1]-d.x[k])/40,-1,1); }
      else gh.vis=false; }
    if(G.state==='finished'&&G.resT>0){ G.resT-=dt; if(G.resT<=0) showResult(); }
  }
}

const order=[], buckets=[];
for(let i=0;i<260;i++) buckets.push([]);
function project(p,wy,z,camX,camY,camZ){
  p.cz=z-camZ; p.scale=CAM_DEPTH/p.cz; p.sx=VW/2-p.scale*camX*FOC; p.sy=CY-p.scale*(wy-camY)*FOC; p.sw=p.scale*G.track.def.roadW*FOC;

function drawSplitSeg(seg,x1,y1,w1,x2,y2,w2,u1,u2,r1,r2,fi,c,far,T){

function drawWreck(x,y,w,t,seed){

function flame(x,y,w,a){

function peerTransport(){
  const PeerC=(window.peerjs&&window.peerjs.Peer)||window.Peer; let peer=null;
  const wrap=conn=>{ const w={id:0,rtt:.1,lastRx:performance.now(),onmsg:null,onclose:null,closed:false,
      send(m){ try{ if(conn.open) conn.send(m); }catch(e){} }, close(){ try{ conn.close(); }catch(e){} } };
    const fin=()=>{ if(w.closed) return; w.closed=true; w.onclose&&w.onclose(); };
    conn.on('data',d=>{ w.lastRx=performance.now(); w.onmsg&&w.onmsg(d); }); conn.on('close',fin); conn.on('error',fin); return w; };
  const ok=()=>PeerC&&window.RTCPeerConnection;
  return {
    host(code,cb){ if(!ok()) return cb.error('nolib'); try{ peer=new PeerC(PEER_PREFIX+code,{debug:0}); }catch(e){ return cb.error('nolib'); }
      peer.on('open',()=>cb.open()); peer.on('connection',conn=>{ conn.on('open',()=>cb.conn(wrap(conn))); });
      peer.on('error',e=>cb.error(e&&e.type||'error'));
      peer.on('disconnected',()=>{ const p=peer; const again=()=>{ if(!p||p.destroyed||!p.disconnected||peer!==p) return; try{ p.reconnect(); }catch(e){} setTimeout(again,3000); }; again(); }); },
    join(code,cb){ if(!ok()) return cb.error('nolib'); try{ peer=new PeerC({debug:0}); }catch(e){ return cb.error('nolib'); }
      peer.on('open',()=>{ const conn=peer.connect(PEER_PREFIX+code,{reliable:true,serialization:'json'}); conn.on('open',()=>cb.conn(wrap(conn))); });
      peer.on('error',e=>cb.error(e&&e.type||'error')); },
    close(){ try{ peer&&peer.destroy(); }catch(e){} peer=null; }
  };
}
/* same-origin stand-in transport used only by automated tests (?net=local) */
function localTransport(){
  const lat=+(qs.get('lat')||0), me='L'+Math.random().toString(36).slice(2,9); let bc=null; const conns=new Map();
  const mk=pid=>({id:0,rtt:lat*2/1000+.002,lastRx:performance.now(),onmsg:null,onclose:null,closed:false,
    send(m){ const s=JSON.stringify(m); setTimeout(()=>{ try{ bc&&bc.postMessage({to:pid,from:me,k:'d',m:s}); }catch(e){} },lat); },
    close(){ try{ bc&&bc.postMessage({to:pid,from:me,k:'x'}); }catch(e){} }});
  const rx=d=>{ const w=conns.get(d.from); if(!w) return; if(d.k==='d'){ w.lastRx=performance.now(); w.onmsg&&w.onmsg(JSON.parse(d.m)); } else if(d.k==='x'&&!w.closed){ w.closed=true; conns.delete(d.from); w.onclose&&w.onclose(); } };
  return {
    host(code,cb){ bc=new BroadcastChannel('dpnet-'+code); bc.onmessage=e=>{ const d=e.data; if(d.k==='c'&&d.to==='host'){ const w=mk(d.from); conns.set(d.from,w); bc.postMessage({to:d.from,from:me,k:'ok'}); cb.conn(w); } else if(d.to===me) rx(d); }; setTimeout(()=>cb.open(),5); },
    join(code,cb){ bc=new BroadcastChannel('dpnet-'+code); let done=false; const tmo=setTimeout(()=>{ if(!done) cb.error('peer-unavailable'); },1500);
      bc.onmessage=e=>{ const d=e.data; if(d.to!==me) return; if(d.k==='ok'&&!done){ done=true; clearTimeout(tmo); const w=mk(d.from); conns.set(d.from,w); cb.conn(w); } else rx(d); };
      bc.postMessage({to:'host',from:me,k:'c'}); },
    close(){ conns.forEach(w=>w.close()); conns.clear(); const b=bc; setTimeout(()=>{ try{ b&&b.close(); }catch(e){} },lat+30); bc=null; },
    _break(){ conns.forEach(w=>{ w.close(); if(!w.closed){ w.closed=true; w.onclose&&w.onclose(); } }); conns.clear(); }
  };
}
/* Supabase Realtime transport: a room is one channel for host -> everyone, plus one private channel per guest,
   so a guest's 10 Hz car updates reach only the host. Uses the JSON (1.0.0) protocol. */
const SB_CFG=(window.__DP_TEST_SUPA&&window.__DP_TEST_SUPA.url)?window.__DP_TEST_SUPA:{url:SUPABASE_URL,key:SUPABASE_KEY};
function supaReady(){ return !!(SB_CFG.url&&SB_CFG.key&&window.supabase&&window.supabase.createClient&&window.WebSocket); }
function supaTransport(){
  const uid=Math.random().toString(36).slice(2,10); let client=null, main=null;
  const mkClient=()=>window.supabase.createClient(SB_CFG.url,SB_CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{vsn:'1.0.0',heartbeatIntervalMs:15000}});
  const chan=name=>client.channel(name,{config:{broadcast:{self:false,ack:false}}});
  const sendOn=(ch,m)=>{ try{ ch.send({type:'broadcast',event:'m',payload:{f:uid,m}}); }catch(e){} };

let bgLast=performance.now();
setInterval(()=>{ const now=performance.now(); if(!document.hidden){ bgLast=now; return; }
  if(NET.on){ if(G.mode==='online'&&(G.state==='race'||G.state==='countdown'||G.state==='finished')){ const n=Math.min(240,Math.round((now-bgLast)/1000/STEP)); for(let i=0;i<n;i++) update(STEP); } NET.tick(); }
  bgLast=now; },250);

/* HUD */
let hudLast=0;
function hudTick(force){
  const now=performance.now(); const P=G.player; if(!P||$('hud').hidden) return;
  const nit=$('hNit'); nit.style.transform='scaleX('+(P.nitro/100).toFixed(3)+')'; $('hNitWrap').classList.toggle('full',P.nitro>=99); $('hNitWrap').classList.toggle('on',P.nitroOn); $('hNitWrap').classList.toggle('chg',!!P.charging&&P.nitro<100);
  { const st=P.st, on=st.passive==='draft'?P.draftT>0:st.passive==='light'?(Math.abs(P.x)>edgeOf(segOf(P.z).u)||P.hitT>0||P.slowT>0):false; const ch=$('hPassive'); if(ch.hidden===on){ ch.hidden=!on; if(on) ch.textContent=L(st.pasN); } }
  if(!force&&now-hudLast<100) return; hudLast=now;
  const ord=standings(), pos=ord.indexOf(P)+1;
  $('hPos').textContent=pos; $('hLap').textContent=Math.min(LAPS,P.lapsDone+1)+'/'+LAPS;
  const lt=G.state==='race'?G.raceT-P.lapStartT:0; $('hTime').innerHTML=fmt(G.state==='countdown'?0:G.raceT)+' <small>'+fmt(Math.max(0,lt))+'</small>';
  $('hSpd').textContent=Math.round(P.speed*KMH);
  const dl=$('hDelta');
  if(G.ghost&&G.state==='race'){ const d=G.ghost.data.d, pd=P.dist-P.lapsDone*G.track.len; let lo=0,hi=d.length-1;
    if(pd>d[0]&&pd<d[hi]){ while(hi-lo>1){ const m=(lo+hi)>>1; if(d[m]<pd) lo=m; else hi=m; } const gt=(lo+(pd-d[lo])/Math.max(1,d[hi]-d[lo]))*G.ghost.data.dt, diff=lt-gt;
      dl.textContent=(diff<0?'−':'+')+Math.abs(diff).toFixed(2); dl.className=diff<0?'ahead':'behind'; } }
  else dl.textContent='';
  const tb=document.querySelector('.tbtn.nitro'); if(tb) tb.classList.toggle('empty',P.nitro<8&&!P.nitroOn);
}
const mmc=$('mm'), mg=mmc.getContext('2d'); let mmBase=null, mmKey='';
function drawMinimap(){
  if($('hud').hidden) return; const tr=G.track, S=240; if(mmKey!==tr.def.id){ mmKey=tr.def.id; mmBase=mk(S,S,(g)=>drawTrackShape(g,tr,S,18,6,'#9b5cff')); }
  mg.clearRect(0,0,S,S); mg.drawImage(mmBase,0,0);
  const P=tr.mm, N=tr.segs.length, s=S-36, dot=(c,r,col)=>{ const p=P[Math.floor(c.z/SEG)%N]; mg.fillStyle=col; mg.beginPath(); mg.arc(18+p[0]*s,18+p[1]*s,r,0,7); mg.fill(); };
  if(G.ghost&&G.ghost.vis){ mg.globalAlpha=.6; dot(G.ghost,7,'#bff8ff'); mg.globalAlpha=1; }
  for(const c of G.cars) if(c!==G.player){ if(c.human){ dot(c,9,'#fff'); dot(c,6.5,c.color); } else dot(c,6,c.color); }
  mg.shadowColor='#fff'; mg.shadowBlur=10; dot(G.player,9,'#fff'); mg.shadowBlur=0; dot(G.player,5,G.player.color);
}

/* touch input */
function refreshTouchUI(){
  document.querySelectorAll('.tbtn').forEach(b=>{ const a=b.dataset.act; let on=false; touch.ptr.forEach(v=>{ if(v.btn===b) on=true; }); b.classList.toggle('on',on); });
  $('hintL').classList.toggle('on',touch.steer<0); $('hintR').classList.toggle('on',touch.steer>0); $('padL').classList.toggle('on',touch.steer<0); $('padR').classList.toggle('on',touch.steer>0);
}
function recomputeTouch(){ let st=0,dr=false,ni=false; touch.ptr.forEach(v=>{ if(v.act==='drift') dr=true; else if(v.act==='nitro') ni=true; else st+=v.x<innerWidth/2?-1:1; }); touch.steer=clamp(st,-1,1); touch.drift=dr; touch.nitro=ni; refreshTouchUI(); }
app.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse') return;
  if(!touch.used){ touch.used=true; if(!$('scrTut').hidden) buildTut(); }
  if(!(G.state==='race'||G.state==='countdown')||G.paused) return;
  if($('touch').hidden){ $('touch').hidden=false; }
  const btn=e.target.closest&&e.target.closest('.tbtn');
  if(e.target.closest&&(e.target.closest('#bPause')||e.target.closest('.screen'))) return;
  touch.ptr.set(e.pointerId,{act:btn?btn.dataset.act:'steer',btn,x:e.clientX});
  try{ (btn||app).setPointerCapture(e.pointerId); }catch(er){}
  recomputeTouch(); e.preventDefault();
},{passive:false});
app.addEventListener('pointermove',e=>{ const v=touch.ptr.get(e.pointerId); if(v&&v.act==='steer'){ v.x=e.clientX; recomputeTouch(); } });
const endPtr=e=>{ if(touch.ptr.delete(e.pointerId)) recomputeTouch(); };
app.addEventListener('pointerup',endPtr); app.addEventListener('pointercancel',endPtr); app.addEventListener('lostpointercapture',endPtr);
app.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  const k=e.code; const inRace=G.state==='race'||G.state==='countdown';
  if(inRace&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(k)>=0) e.preventDefault();
  if(k==='Escape'||k==='KeyP'){ if(inRace&&document.activeElement!==$('joinCode')) setPause(!(G.paused||G.netMenu)); return; }
  if(G.paused||G.netMenu) return;
  keys[k]=true;
  if(k==='Enter'&&!e.repeat){ if(!$('scrTitle').hidden) $('bStart').click(); else if(!$('scrSetup').hidden){ if(G.mode!=='online') startRace(); else if(document.activeElement===$('joinCode')) NET.join($('joinCode').value); } else if(!$('scrTut').hidden) endTut(); }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
['touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ if(AU.ctx&&AU.ctx.state!=='running'&&!G.paused&&!document.hidden) AU.ctx.resume().catch(()=>{}); },{passive:true}));

let wake=null;
function requestWake(){ try{ if(navigator.wakeLock&&!wake) navigator.wakeLock.request('screen').then(w=>{ wake=w; w.addEventListener('release',()=>{ wake=null; }); }).catch(()=>{}); }catch(e){} }

/* layout */
function layout(){
  const w=innerWidth, h=innerHeight;
  const racing=!$('hud').hidden;
  const portrait=h>w*1.08&&w<820&&racing;
  app.classList.toggle('portrait',portrait);
  VW=w; VH=portrait?Math.round(Math.min(h-210,w*1.3)):h;
  $('view').style.height=VH+'px'; app.style.setProperty('--vh',VH+'px');
  const q=QL[G.q]; let r=Math.min(window.devicePixelRatio||1,q.dpr); r=Math.min(r,Math.sqrt(q.pix/(VW*VH))); RS=Math.max(.5,r);
  cv.width=Math.round(VW*RS); cv.height=Math.round(VH*RS);
  FOC=Math.min(VW*.5,VH*.56); CY=VH-FOC-VH*.03;
  skyKey='';
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,200));

/* main loop with automatic quality drop */
let last=performance.now(), acc=0, perfT=0, perfN=0, perfAcc=0, qCool=4;
function frame(now){
  requestAnimationFrame(frame);
  if(now-last>3000) NET.lastGapT=now;
  let dtR=(now-last)/1000; last=now; if(!(dtR>0)) dtR=.016; dtR=Math.min(dtR,.1);
  if(!G.manual&&!G.paused){ acc+=dtR; let n=0; while(acc>=STEP&&n<14){ update(STEP); acc-=STEP; n++; } if(n>=14) acc=0; }
  if(tutT>=0){ tutT+=dtR; $('tutProg').style.width=Math.min(100,tutT/8*100)+'%'; if(tutT>=8) endTut(); }
  if(G.state==='title'&&!G.manual){ G.attractT+=dtR; if(G.attractT>15&&!$('scrTitle').hidden){ attract((G.attractI+1)%TRACKS.length); } }
  FX.dt=G.paused?0:dtR;
  if(!G.paused||G.needDraw){ render(); G.needDraw=false; }
  if(G.ffJob) ffChunk(6);
  hudTick(false); drawMinimap(); AU.frame(); NET.tick(); netUiTick(now);
  if(!document.hidden&&!G.paused&&G.state!=='boot'){ perfAcc+=dtR; perfN++; qCool-=dtR;
    if(perfAcc>1.5){ const fps=perfN/perfAcc; G.fps=fps; if(fps<45&&G.q>0&&qCool<=0){ G.q--; qCool=3; layout(); } perfAcc=0; perfN=0; } }
}

/* test hooks for automated checks (no effect on normal play) */
window.__dp={G,TRACKS,CARS,SK,getTrack,setupField,startRace,update,render,standings,STEP,BASE,LAPS,showSetup,attract,setPause,layout,store,
  step(n){ for(let i=0;i<n;i++) update(STEP); },aiControl,keys,touch,NET,setLaps(n){ LAPS=n; },carByNet,ffRun(){ while(G.ffJob) ffChunk(1e9); },ffChunk6(){ ffChunk(6); },carT};

/* boot */
buildSprites(); FX.init();
applyLang(); layout();
attract(G.trackI);
showScreen('scrTitle');
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
