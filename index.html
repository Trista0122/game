<!doctype html>

<head>

<meta name="claude:viewport-fit-sides" content="cover">

<meta property="og:title" content="棱光漂移 Drift Prism">
<meta property="og:description" content="点开就能玩的霓虹赛车：漂移攒氮气，3 圈对决 7 辆 AI。无需安装或登录。">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0520'/%3E%3Cpath d='M34 9 L56 51 H12 Z' fill='none' stroke='%232ef2ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M5 38 H38 M9 46 H30' stroke='%23ff3fb4' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Layout: one full-bleed canvas stage. HUD rides the sky band, touch controls sit in the bottom corners;
   in phone portrait the stage shrinks to the top and a control pad fills the bottom. */
:root{
  --void:#08041a;
  --night:#140a33;
  --ink:#f1ecff;
  --mute:#a79ed0;
  --cyan:#2ef2ff;
  --magenta:#ff3fb4;
  --violet:#9b5cff;
  --amber:#ffc65a;
  --panel:rgba(13,7,36,.86);
  --line:rgba(150,120,255,.32);
  --display:"Bahnschrift SemiCondensed","Bahnschrift","DIN Condensed","Avenir Next Condensed","Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:max(10px,env(safe-area-inset-top,0px));
  --gb:max(12px,env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--void);touch-action:none}
#view{position:absolute;left:0;top:0;width:100%;height:100%}
#cv{display:block;width:100%;height:100%;outline:none}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.55}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;
  padding:var(--gt) var(--gr) 0 var(--gl);pointer-events:none;font-family:var(--display);text-shadow:0 0 10px rgba(46,242,255,.35)}
.hud-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.pos{display:flex;align-items:baseline;gap:2px;line-height:.9}
.pos b{font-size:46px;font-weight:700;color:var(--ink);font-style:italic;text-shadow:0 0 14px rgba(255,63,180,.7)}
.pos span{font-size:18px;color:var(--mute)}
.lapline{display:flex;gap:10px;align-items:baseline;font-size:15px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.lapline b{color:var(--cyan);font-size:20px;font-weight:600}
.tm{font:600 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.tm small{color:var(--mute);font-weight:400}
#hDelta{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
#hDelta.ahead{color:#5dffa8}#hDelta.behind{color:#ff6b8a}
.hud-c{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px}
.spd{display:flex;align-items:baseline;gap:4px;line-height:1}
.spd b{font:700 34px var(--display);font-style:italic;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.spd small{font-size:13px;color:var(--mute);letter-spacing:.08em}
.nit{position:relative;width:170px;height:12px;transform:skewX(-20deg);border:1px solid rgba(46,242,255,.55);background:rgba(10,5,30,.6);overflow:hidden}
.nit i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(.25);background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 12px var(--cyan)}
.nit.full{border-color:var(--cyan);box-shadow:0 0 14px rgba(46,242,255,.7)}
.nit.on i{background:linear-gradient(90deg,var(--magenta),#fff)}
.nit-l{font-size:11px;letter-spacing:.22em;color:var(--mute)}
.hud-r{display:flex;justify-content:flex-end;align-items:flex-start;gap:10px}
#mm{width:120px;height:120px;display:block}
#bPause{pointer-events:auto;width:44px;height:44px;border:1px solid var(--line);background:rgba(13,7,36,.6);border-radius:10px;display:grid;place-items:center}
#bPause svg{width:18px;height:18px}

#cmsg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;font:italic 700 64px var(--display);letter-spacing:.04em;
  color:var(--ink);text-shadow:0 0 18px var(--magenta),0 0 40px rgba(155,92,255,.8);opacity:0;transition:opacity .25s}
#cmsg.show{opacity:1}
#cmsg.small{font-size:30px;top:24%;text-shadow:0 0 16px var(--cyan)}
#toast{position:absolute;left:50%;top:calc(var(--gt) + 96px);transform:translate(-50%,20px);max-width:min(92vw,460px);padding:10px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none}
.tbtn{pointer-events:auto;position:absolute;width:88px;height:88px;border-radius:50%;border:2px solid rgba(46,242,255,.55);background:rgba(12,6,34,.38);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 13px var(--body);letter-spacing:.04em;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);touch-action:none}
.tbtn svg{width:30px;height:30px}
.tbtn.on{background:rgba(46,242,255,.32);box-shadow:0 0 22px rgba(46,242,255,.7)}
.tbtn.nitro{border-color:rgba(255,63,180,.7);width:76px;height:76px}
.tbtn.nitro.on{background:rgba(255,63,180,.38);box-shadow:0 0 22px rgba(255,63,180,.8)}
.tbtn.nitro.empty{opacity:.45}
.tb-dl{left:calc(var(--gl) + 4px);bottom:calc(var(--gb) + 6px)}
.tb-dr{right:calc(var(--gr) + 4px);bottom:calc(var(--gb) + 6px)}
.tb-n{right:calc(var(--gr) + 10px);bottom:calc(var(--gb) + 112px)}
.steer-hint{position:absolute;top:50%;transform:translateY(-50%);font:700 30px var(--display);color:rgba(46,242,255,.35);pointer-events:none;transition:opacity .6s}
.steer-hint.l{left:calc(var(--gl) + 8px)}.steer-hint.r{right:calc(var(--gr) + 8px)}
.steer-hint.on{color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
.padbg{display:none}
#app.portrait #touch{top:var(--vh)}
#app.portrait .padbg{display:grid;position:absolute;inset:0;grid-template-columns:1fr 1fr;gap:10px;padding:14px var(--gr) calc(var(--gb) + 8px) var(--gl);
  background:linear-gradient(180deg,#0f0730,#07031a)}
.padbg div{border:1px solid var(--line);border-radius:18px;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;
  font:700 44px var(--display);color:rgba(46,242,255,.4);background:rgba(155,92,255,.06)}
.padbg div.on{background:rgba(46,242,255,.16);color:var(--cyan)}
#app.portrait .steer-hint{display:none}
#app.portrait .tb-dl{bottom:calc(var(--gb) + 18px);left:calc(var(--gl) + 10px)}
#app.portrait .tb-dr{bottom:calc(var(--gb) + 18px);right:calc(var(--gr) + 10px)}
#app.portrait .tb-n{right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 24px)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:var(--gt) var(--gr) var(--gb) var(--gl);touch-action:pan-y}
.btn-hero{position:relative;border:0;padding:20px 46px;font:italic 700 26px var(--display);letter-spacing:.06em;color:#0a0520;text-transform:uppercase;
  background:linear-gradient(100deg,var(--cyan),#b6a0ff 55%,var(--magenta));clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
  box-shadow:0 0 30px rgba(46,242,255,.5);transition:transform .12s,filter .12s}
.btn-hero:hover{filter:brightness(1.12)}
.btn-hero:active{transform:scale(.97)}
.btn-hero.sm{padding:14px 30px;font-size:20px}
.btn{border:1px solid var(--line);background:rgba(155,92,255,.10);padding:11px 18px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--cyan)}
.btn-ghost{border:1px solid var(--line);background:transparent;padding:8px 16px;border-radius:999px;color:var(--mute)}
.chip{position:absolute;z-index:25;top:var(--gt);right:var(--gr);border:1px solid var(--line);background:rgba(13,7,36,.6);border-radius:999px;padding:6px 12px;font:600 13px var(--body);letter-spacing:.05em}

/* title */
.title{justify-content:flex-end;gap:26px;padding-bottom:calc(var(--gb) + 7vh);
  background:linear-gradient(180deg,rgba(8,4,26,0) 40%,rgba(8,4,26,.65) 100%)}
.brand{display:flex;align-items:center;gap:18px}
.mark{width:clamp(56px,9vw,92px);height:auto;filter:drop-shadow(0 0 12px rgba(46,242,255,.7))}
.logo{margin:0;display:flex;flex-direction:column;line-height:.92;transform:skewX(-9deg)}
.logo .lm{font:italic 800 clamp(48px,9.5vw,108px) var(--display);letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 10%,#b9f9ff 45%,var(--magenta) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,63,180,.55))}
.logo .ls{font:600 clamp(13px,1.9vw,19px) var(--display);letter-spacing:.55em;color:var(--cyan);margin-top:8px;padding-left:4px}
.title .btn-hero{align-self:flex-start;font-size:clamp(24px,3.4vw,34px);padding:clamp(18px,2.4vw,26px) clamp(44px,6vw,72px);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 46px rgba(255,63,180,.7)}}

/* tutorial */
.tutor{justify-content:center;align-items:center;gap:18px;background:rgba(6,3,20,.84);text-align:center;overflow-y:auto}
.tutor h2{margin:0;font:italic 700 30px var(--display);letter-spacing:.04em}
.tut-grid{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:14px;width:100%;justify-content:center}
.tut{margin:0;padding:16px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(155,92,255,.07);display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.tut figcaption{display:flex;flex-direction:column;gap:4px}
.tut figcaption b{font:700 18px var(--display);letter-spacing:.05em;color:var(--cyan)}
.tut figcaption span{color:var(--mute);font-size:13px}
.ill{height:74px;display:flex;align-items:center;justify-content:center;gap:6px}
kbd{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border:1px solid rgba(46,242,255,.6);border-bottom-width:4px;border-radius:8px;
  font:700 16px var(--mono);color:var(--ink);background:#150b38}
kbd.wide{min-width:120px}
.blink{animation:kb 1.2s steps(1) infinite}.blink.d2{animation-delay:.6s}
@keyframes kb{0%{background:#150b38}50%{background:var(--cyan);color:#0a0520}}
.phone{width:112px;height:62px;border:2px solid var(--mute);border-radius:10px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.phone i{animation:half 1.6s steps(1) infinite}
.phone i+i{animation-delay:.8s}
@keyframes half{0%{background:rgba(46,242,255,.45)}50%{background:transparent}}
.rb{width:60px;height:60px;border-radius:50%;border:2px solid var(--cyan);display:grid;place-items:center;font-weight:700;font-size:13px;animation:kb 1.2s steps(1) infinite}
.rb.n{border-color:var(--magenta)}
.tut-note{margin:0;color:var(--ink);max-width:46ch}
.tut-bar{width:min(420px,80vw);height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.tut-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--magenta))}

/* setup */
.setupS{background:rgba(6,3,20,.80);overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center}
.setup{width:100%;max-width:980px;display:flex;flex-direction:column;gap:12px;padding-block:44px 8px}
.setup-h{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.setup h3{margin:4px 0 0;font:600 12px var(--body);letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 16px;font-weight:600;color:var(--mute)}
.seg button.sel{background:linear-gradient(100deg,rgba(46,242,255,.25),rgba(155,92,255,.3));color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(20,10,51,.7);display:flex;gap:12px;align-items:center;min-width:0}
.card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(46,242,255,.35)}
.card canvas{flex:none;width:72px;height:72px;border-radius:10px}
.card .ct{display:flex;flex-direction:column;gap:3px;min-width:0}
.card b{font:700 18px var(--display);letter-spacing:.03em}
.card .cd{font-size:12px;color:var(--mute);line-height:1.35}
.card .cr{font:600 12px var(--mono);color:var(--cyan);font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:11px;color:var(--mute);width:100%}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.go-row{position:sticky;bottom:0;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-top:6px;padding-block:10px calc(var(--gb) + 2px);background:linear-gradient(180deg,rgba(8,4,26,0),rgba(8,4,26,.92) 30%)}
.go-row p{margin:0;color:var(--mute);font-size:13px;flex:1 1 220px}

/* panels */
.center{justify-content:center;align-items:center;background:rgba(6,3,20,.72);overflow-y:auto}
.panel{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 50px rgba(155,92,255,.25);margin:auto 0}
.panel h2{margin:0 0 4px;font:italic 700 30px var(--display)}
.panel p{margin:0;color:var(--mute)}
.panel .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{width:min(520px,100%);gap:12px}
.r-top{display:flex;align-items:center;gap:16px}
.r-pos{font:italic 800 76px/0.9 var(--display);color:var(--ink);text-shadow:0 0 20px var(--magenta)}
.r-pos small{font-size:24px;color:var(--mute)}
.r-label{font:700 22px var(--display);letter-spacing:.06em;color:var(--cyan)}
.r-meta{color:var(--mute);font-size:13px}
.r-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r-stats div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.r-stats span{font-size:12px;color:var(--mute);letter-spacing:.06em}
.r-stats b{font:700 24px var(--mono);font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--magenta);color:#14051d;font-weight:700;font-size:12px;letter-spacing:.08em}
.r-cols{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}
.r-cols h4{margin:0 0 4px;font-size:11px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.r-list{list-style:none;margin:0;padding:0;font:13px var(--mono);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.r-list li{display:flex;justify-content:space-between;gap:8px}
.r-list li.me{color:var(--cyan);font-weight:700}
.r-list li.best{color:#5dffa8}
.r-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#shareBox textarea{width:100%;height:76px;margin-top:6px;background:#0b0624;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px var(--body);-webkit-user-select:text;user-select:text}

@media (max-height:500px){
  .pos b{font-size:34px}.spd b{font-size:26px}.nit{width:130px;height:10px}#mm{width:82px;height:82px}
  .title{gap:14px;padding-bottom:calc(var(--gb) + 4vh)}
  .tutor{gap:10px}.tutor h2{font-size:22px}.ill{height:56px}.tut{padding:10px 8px;gap:6px}
  .setup{gap:8px;padding-block:38px 0}.card{padding:8px}#carCards .cd{display:none}.go-row{padding-block:6px 4px}.card canvas{width:52px;height:52px}.card b{font-size:15px}
  .r-pos{font-size:56px}.panel{padding:16px;gap:8px}.result{gap:8px}
  .tbtn{width:76px;height:76px}.tbtn.nitro{width:66px;height:66px}.tb-n{bottom:calc(var(--gb) + 92px)}
}
@media (max-width:640px){
  .tut-grid{grid-template-columns:1fr;max-width:360px}
  .tut{flex-direction:row;text-align:left;padding:10px 12px}.ill{height:auto;min-width:118px}
  .cards{grid-template-columns:1fr}
  .card canvas{width:56px;height:56px}
  #hud{gap:6px}.pos b{font-size:32px}.spd b{font-size:24px}.nit{width:100px}#mm{width:72px;height:72px}#bPause{width:38px;height:38px}
  .r-cols{grid-template-columns:1fr}
}
@media (max-width:640px) and (max-height:500px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-height:500px) and (min-width:641px){.tut-grid{grid-template-columns:repeat(3,minmax(0,200px))}.tut{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv" tabindex="-1" aria-label="race view"></canvas>
    <div id="hud" hidden>
      <div class="hud-l">
        <div class="pos" id="hPosWrap"><b id="hPos">8</b><span>/8</span></div>
        <div class="lapline"><span data-i="lap">圈</span><b id="hLap">1/3</b></div>
        <div class="tm" id="hTime">0:00.00</div>
        <div id="hDelta"></div>
      </div>
      <div class="hud-c">
        <div class="spd"><b id="hSpd">0</b><small>KM/H</small></div>
        <div class="nit" id="hNitWrap"><i id="hNit"></i></div>
        <div class="nit-l">NITRO</div>
      </div>
      <div class="hud-r">
        <canvas id="mm" width="240" height="240" aria-hidden="true"></canvas>
        <button id="bPause" aria-label="Pause"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" fill="#f1ecff"/><rect x="11" y="2" width="4" height="14" fill="#f1ecff"/></svg></button>
      </div>
    </div>
    <div id="cmsg"></div>
  </div>

  <div id="touch" hidden>
    <div class="padbg"><div id="padL">◀</div><div id="padR">▶</div></div>

/* ---------------- track building ---------------- */
function pt(){ return {wy:0,z:0,cz:0,scale:0,sx:0,sy:0,sw:0}; }
const trackCache={};
function getTrack(i){ return trackCache[i]||(trackCache[i]=buildTrack(TRACKS[i])); }
function buildTrack(def){
  const segs=[]; let y=0;
  const add=(curve,ny)=>{ const n=segs.length; segs.push({i:n,curve,y1:y,y2:ny,sprites:[],obs:[],surf:[],glow:0,color:Math.floor(n/RUMBLE)%2,p1:pt(),p2:pt(),clip:0,vis:false,fogI:0,cars:[]}); y=ny; };
  for(const s of def.secs){ const k=def.scale, e=Math.round(s[0]*k), h=Math.round(s[1]*k), l=Math.round(s[2]*k), tot=e+h+l, c=s[3], sy=y, ey=sy+s[4]*SEG;
    for(let i=0;i<e;i++) add(easeIn(0,c,i/e), easeInOut(sy,ey,(i+1)/tot));
    for(let i=0;i<h;i++) add(c, easeInOut(sy,ey,(e+i+1)/tot));
    for(let i=0;i<l;i++) add(easeInOut(c,0,i/l), easeInOut(sy,ey,(e+h+i+1)/tot)); }
  const N=segs.length, endY=y;
  segs.forEach((s,i)=>{ s.y1-=endY*i/N; s.y2-=endY*(i+1)/N; s.p1.wy=s.y1; s.p2.wy=s.y2; s.p1.z=i*SEG; s.p2.z=(i+1)*SEG; });
  const tr={def,segs,len:N*SEG,theme:THEME[def.theme]};
  decorate(tr); placeObstacles(tr); buildMinimap(tr);
  return tr;
}
function decorate(tr){
  const S=tr.segs,N=S.length,def=tr.def,r=rng(def.seed*13+5),th=def.theme;
  const put=(i,type,x,s,coll)=>{ const sp=SPR[type]; s=s||1; const ww=sp.w*s; S[i%N].sprites.push({t:type,x,s,c:coll?1:0,cx:x+Math.sign(x)*(ww/2)/def.roadW,cw:sp.cw*s}); };
  S[0].sprites.push({t:'gantry',x:0,s:def.roadW*2.9/4000,c:0,cx:0,cw:0});
  for(let i=6;i<N;i++){ const cu=S[i].curve, out=cu>0?-1:1;
    if(th==='city'){
      if(i%10===0){ put(i,'poleC',-1.22,1,1); put(i,'poleM',1.22,1,1); }
      if(i%4===0) put(i,'tower'+(i%3),-(2.6+r()*2.4),.8+r()*.6,0);
      if(i%4===2) put(i,'tower'+((i+1)%3),2.6+r()*2.4,.8+r()*.6,0);
      if(i%70===35) put(i,'holo',r()<.5?-1.5:1.5,1,1);
      if(Math.abs(cu)>=3&&i%7===0) put(i,cu>0?'chevR':'chevL',out*1.3,1,1);
    } else if(th==='coast'){
      if(i%9===0) put(i,'palm',1.35+r()*.7,.8+r()*.5,1);
      if(i%13===0) put(i,'palm',-(1.35+r()*.5),.8+r()*.5,1);
      if(i%60===20) put(i,r()<.5?'hut':'guard',2.4+r()*.8,1,0);
      if(Math.abs(cu)>=2.5&&i%8===0) put(i,cu>0?'chevR':'chevL',out*1.3,1,1);
      if(i%24===12) put(i,'lampW',-1.2,1,1);
    } else {
      if(i%3===0) put(i,'pine'+(i%2),(r()<.5?-1:1)*(1.6+r()*2.2),.7+r()*.7,1);
      if(i%11===0){ const sd=(i%22===0)?-1:1; put(i,'lamp',sd*1.18,1,1); for(let j=0;j<5;j++) S[(i+j)%N].glow=sd; }
      if(Math.abs(cu)>=2&&i%4===0) put(i,'rail',out*1.12,1,1);
      if(Math.abs(cu)>=4&&i%9===0) put(i,cu>0?'chevR':'chevL',out*1.5,1,1);
      if(i%37===0) put(i,'rockS',(r()<.5?-1:1)*(1.6+r()),.8+r()*.5,1);
    }
  }
}
function placeObstacles(tr){
  const S=tr.segs,N=S.length,def=tr.def,r=rng(def.seed*31+7),th=def.theme;
  const lanesX=[]; for(let k=0;k<def.lanes;k++) lanesX.push(-1+(2*k+1)/def.lanes);
  const solidK={city:'barrier',coast:'cones',ridge:'rocks'}[th], surfK={city:'pad',coast:'sand',ridge:'puddle'}[th];
  const ww={barrier:620,cones:700,rocks:680};
  for(let i=240;i<N-150;i+=85+Math.floor(r()*100)){
    const cu=Math.abs(S[i].curve);
    const wantSurf = th==='city' ? (cu<.5 && r()<.5) : r()<.45;
    if(wantSurf){ const x=lanesX[Math.floor(r()*lanesX.length)]*.9, len=surfK==='pad'?2:6, hw=surfK==='pad'?.2:surfK==='sand'?.3:.32;
      for(let j=0;j<len;j++) S[(i+j)%N].surf.push({k:surfK,x,hw}); }
    else if(cu<=4){ const a=Math.floor(r()*lanesX.length); S[i].obs.push({k:solidK,x:lanesX[a]*.85,ww:ww[solidK]});
      if(def.lanes>=3 && r()<.3){ const b=(a+1+Math.floor(r()*(def.lanes-1)))%def.lanes; S[i+8].obs.push({k:solidK,x:lanesX[b]*.85,ww:ww[solidK]}); } }
  }
}
function buildMinimap(tr){
  const S=tr.segs,N=S.length; let sum=0; S.forEach(s=>sum+=s.curve); const k=sum>1?Math.PI*2/sum:.002;
  let h=0,x=0,y=0; const P=[]; for(let i=0;i<N;i++){ P.push([x,y]); h+=S[i].curve*k; x+=Math.sin(h); y-=Math.cos(h); }

function setupField(trackI, mode, diff, carI, attract){

/* ---------------- physics ---------------- */
function segOf(z){ const S=G.track.segs; return S[Math.floor(z/SEG)%S.length]; }
function fx(c,type,a){ if(c!==G.player||G.state==='title') return; FX.event(type,a); }
function endDrift(c,award){
  if(!c.drift) return; const tier=c.driftT>1.6?2:c.driftT>.7?1:0;
  if(award&&tier){ c.boostT=Math.max(c.boostT,tier===2?1.0:.55); fx(c,'driftBoost',tier); }
  c.drift=0; c.driftT=0;
}
function stepCar(c,inp,dt){
  const tr=G.track,S=tr.segs,N=S.length,Lt=tr.len,roadW=tr.def.roadW,st=c.st;
  const seg=S[Math.floor(c.z/SEG)%N];
  c.steer=inp.steer;
  if(inp.brake){ if(!c.prevBrake) c.brakeT=0; else c.brakeT+=dt; } c.prevBrake=inp.brake;
  const off=Math.abs(c.x)>1;
  if(inp.brake&&!inp.noDrift&&!c.drift&&c.brakeT<.3&&Math.abs(inp.steer)>.3&&c.speed>BASE*.42&&!off){ c.drift=inp.steer>0?1:-1; c.driftT=0; c.drifts++; fx(c,'driftStart'); }
  if(c.drift&&(!inp.brake||c.speed<BASE*.3||off)) endDrift(c,!off&&c.speed>=BASE*.3);
  if(inp.nitro&&!c.nitroOn&&c.nitro>=8){ c.nitroOn=true; c.nitroMin=.5; c.nitroUses++; fx(c,'nitro'); }
  if(c.nitroOn){ c.nitro-=30*dt; c.nitroMin-=dt; if(c.nitro<=0||(!inp.nitro&&c.nitroMin<=0)){ c.nitroOn=false; if(c.nitro<0) c.nitro=0; } }
  c.boostT=Math.max(0,c.boostT-dt); c.wetT=Math.max(0,c.wetT-dt); c.slowT=Math.max(0,c.slowT-dt); c.hitT=Math.max(0,c.hitT-dt); c.obsCool=Math.max(0,c.obsCool-dt); c.padCool=Math.max(0,c.padCool-dt);
  const boosting=c.nitroOn||c.boostT>0;
  let top=BASE*st.top*c.tf;
  if(c.nitroOn) top*=1+.2*st.np; else if(c.boostT>0) top*=1.14;
  if(c.drift) top*=.94;
  if(c.slowT>0) top*=.8;
  if(off){ top=Math.min(top,BASE*.5); c.offT+=dt; }
  if(inp.brake&&!c.drift) c.speed-=BRAKE*dt;
  else if(c.speed<top){ const a=ACCEL*st.acc*(boosting?2:1)*(1-.55*c.speed/top); c.speed=Math.min(top,c.speed+a*dt); }
  else c.speed=Math.max(top,c.speed-(off?OFF_DECEL:DECEL)*dt);

  c.speed=clamp(c.speed,0,BASE*1.6);

  c.x+=lat*dt;

  const prev=c.dist; c.dist+=c.speed*dt; c.z=mod(c.dist,Lt);

    for(const o of sg.obs){ if(c.obsCool<=0&&Math.abs(c.x-o.x)<(hc+o.ww/2/roadW)*.8){ c.speed*=.45; c.x+=(c.x>=o.x?1:-1)*.1; c.obsCool=.5; c.hitT=.35; c.hits++; endDrift(c,false); fx(c,'hit',1); } }
    for(const o of sg.surf){ if(Math.abs(c.x-o.x)<o.hw+hc*.5){
      if(o.k==='pad'){ if(c.padCool<=0){ c.boostT=Math.max(c.boostT,1.1); c.nitro=Math.min(100,c.nitro+6); c.padCool=.4; fx(c,'pad'); } }
      else if(o.k==='puddle'){ if(c.wetT<=0) fx(c,'splash'); c.wetT=.7; }
      else { if(c.slowT<=0) fx(c,'sand'); c.slowT=.35; } } }
    if(Math.abs(c.x)>.95&&c.obsCool<=0) for(const sp2 of sg.sprites){ if(sp2.c&&Math.abs(c.x-sp2.cx)<hc+sp2.cw/roadW){
      c.speed=Math.min(c.speed,BASE*.18); const gap=hc+sp2.cw/roadW+.02; c.x=sp2.cx>0?Math.min(c.x,sp2.cx-gap):Math.max(c.x,sp2.cx+gap); c.obsCool=.4; c.hitT=.4; c.hits++; endDrift(c,false); fx(c,'hit',2); break; } }

      const tc=G.raceT-dt+dt*clamp((li*Lt-prev)/Math.max(1e-6,c.dist-prev),0,1);
      const lt=tc-c.lapStartT; c.laps.push(lt); c.lapStartT=tc; c.lapsDone=li;

function resolveCars(){
  const cs=G.cars,Lt=G.track.len,hw=CAR_W/G.track.def.roadW*.92;
  for(let i=0;i<cs.length;i++) for(let j=i+1;j<cs.length;j++){ const a=cs[i],b=cs[j];
    let dz=b.z-a.z; if(dz>Lt/2) dz-=Lt; else if(dz<-Lt/2) dz+=Lt;
    const adz=Math.abs(dz), dx=b.x-a.x;
    if(adz>=CAR_LEN||Math.abs(dx)>=hw) continue;
    const back=dz>0?a:b, front=dz>0?b:a;
    if(adz>CAR_LEN*.45){
      if(back.speed>front.speed){ const vb=back.speed; back.speed=front.speed*.9; front.speed=Math.min(front.speed+(vb-front.speed)*.25,BASE*1.3); }
      back.dist-=(CAR_LEN-adz); back.z=mod(back.dist,Lt);
      const nudge=(hw-Math.abs(dx))*.15*(dx>=0?1:-1); b.x+=nudge; a.x-=nudge;
    } else { const push=(hw-Math.abs(dx))*.5+.004, sg=dx>=0?1:-1; b.x+=sg*push; a.x-=sg*push; a.speed*=.99; b.speed*=.99; }
    if(a.isPlayer||b.isPlayer){ const p=a.isPlayer?a:b; p.bumps++; fx(p,'bump'); }
  }
}

/* ---------------- AI driver (same physics and inputs as the player) ---------------- */
function aiControl(c){
  const tr=G.track,S=tr.segs,N=S.length,Lt=tr.len,roadW=tr.def.roadW,sk=c.sk;
  const i0=Math.floor(c.z/SEG)%N, v=c.speed, s=v/BASE, sp=Math.min(1,s), g=c.st.grip;
  const topNow=BASE*c.st.top*c.tf*(c.nitroOn?1+.2*c.st.np:c.boostT>0?1.14:1);
  let target=topNow, wantDrift=false, curveSum=0, straight=true, driftDir=0;
  const look=10+Math.floor(v*1.25/SEG), zin=c.z%SEG, canDrift=c.canDrift&&sk.drift>0;
  for(let k=0;k<look;k++){ const sg=S[(i0+k)%N], cu=Math.abs(sg.curve);
    if(k<30) curveSum+=sg.curve;
    if(cu>1.5&&k<45) straight=false;
    if(cu<.8) continue;
    const vAllow=BASE*Math.min(1.6,3.6*g*sk.corner/cu);
    if(canDrift&&cu>=2.8&&(vAllow<target*.97||sk.drift>=1&&cu>=3.5)){ if(k<10){ wantDrift=true; if(!driftDir) driftDir=Math.sign(sg.curve);} continue; }
    if(vAllow>=target) continue;
    const d=Math.max(0,k*SEG-zin), vr=Math.sqrt(vAllow*vAllow+2*BRAKE*.55*d);
    if(vr<target) target=vr;
  }
  let tx=c.lane+clamp(curveSum*.004,-.45,.45)+Math.sin(G.time*.7+c.seed)*sk.noise;
  const hc=CAR_W/2/roadW;
  for(let k=1;k<36;k++){ const sg=S[(i0+k)%N];
    for(const o of sg.obs){ const clr=hc+o.ww/2/roadW+.07; if(Math.abs(tx-o.x)<clr){ const l=o.x-clr*1.05, r=o.x+clr*1.05; tx=(l<-.9)?r:(r>.9)?l:(Math.abs(l-c.x)<Math.abs(r-c.x)?l:r); } }
    for(const o of sg.surf){ if(o.k==='pad'){ if(c.usePads&&k<28) tx=o.x; } else { const clr=o.hw+hc*.5+.05; if(Math.abs(tx-o.x)<clr){ const l=o.x-clr, r=o.x+clr; tx=(l<-.9)?r:(r>.9)?l:(Math.abs(l-c.x)<Math.abs(r-c.x)?l:r); } } }
  }
  for(const o of G.cars){ if(o===c) continue; let dz=o.z-c.z; if(dz<-Lt/2) dz+=Lt; else if(dz>Lt/2) dz-=Lt;
    if(dz>0&&dz<1600&&Math.abs(o.x-c.x)<.34&&o.speed<v+300){
      const side=o.x>.15?-1:o.x<-.15?1:(c.x>=o.x?1:-1); tx=o.x+side*.45;
      if(dz<700&&Math.abs(o.x-c.x)<.22) target=Math.min(target,o.speed*.98); } }
  tx=clamp(tx,-.88,.88);
  const seg0=S[i0], wet=c.wetT>0?1.45:1, Kx=3;
  let steer;
  if(c.drift){ const A=3.2*g*Math.max(sp,.05); steer=(Kx*(tx-c.x)+seg0.curve*.36*s*s*wet-c.drift*.9*sp)/A; }
  else { const A=2.4*g*Math.max(sp,.05); steer=(Kx*(tx-c.x)+seg0.curve*.6*s*s*wet)/A; }
  steer=clamp(steer,-1,1);

  const inCurve=Math.abs(seg0.curve)>=2.4;
  if(canDrift&&v>BASE*.5&&(wantDrift||(c.drift&&inCurve))){ brake=true; noDrift=false;
    if(!c.drift){ const d=driftDir||Math.sign(seg0.curve)||1; if(steer*d<.4) steer=d*.45; } }
  else if(v>target+250){ brake=true; }
  const nitro=c.nitroOn ? straight : (straight&&!c.drift&&c.nitro>sk.nitroAt&&v>BASE*.6);

  if(G.mode==='race'&&G.state==='race'&&G.player&&!c.isPlayer){ const gap=c.dist-G.player.dist; const want=c.tf0*(gap>3000?.965:gap<-3000?1.03:1); c.tf=Math.min(1,lerp(c.tf,want,.002)); }
  return {steer,brake,nitro,noDrift};
}

/* ---------------- input ---------------- */
const keys={};
const touch={ptr:new Map(),steer:0,drift:false,nitro:false,used:false};
let steerVal=0;
function playerInput(dt){
  let tg=0; if(keys.ArrowLeft||keys.KeyA) tg-=1; if(keys.ArrowRight||keys.KeyD) tg+=1; tg=clamp(tg+touch.steer,-1,1);
  const rate=(tg===0||tg*steerVal<0)?10:7; steerVal=steerVal<tg?Math.min(tg,steerVal+rate*dt):Math.max(tg,steerVal-rate*dt);
  return {steer:steerVal,brake:!!(keys.Space||keys.ArrowDown||keys.KeyS||touch.drift),nitro:!!(keys.ShiftLeft||keys.ShiftRight||keys.ArrowUp||keys.KeyW||touch.nitro),noDrift:false};
}
function clearInput(){ for(const k in keys) keys[k]=false; touch.ptr.clear(); touch.steer=0; touch.drift=false; touch.nitro=false; steerVal=0; refreshTouchUI(); }

/* ---------------- race flow ---------------- */
function onPlayerLap(lt,li){
  const p=G.player, tid=G.track.def.id; const b=best[tid]||(best[tid]={});
  const rec=G.rec; let isBest=false;
  if(rec&&rec.d.length>10&&(!b.lap||lt<b.lap)){ isBest=!!b.lap; b.lap=lt; G.newLapRec=true;
    const gh={t:lt,car:G.carI,dt:.05,d:rec.d.slice(),x:rec.x.slice()}; ghosts[tid]=gh; store.set('ghost_'+tid,gh); store.set('best',best); }
  else if(!b.lap||lt<b.lap){ b.lap=lt; store.set('best',best); }
  G.rec={d:[],x:[],lap:li};
  if(li<LAPS){ FX.event('lap',li); if(isBest) setTimeout(()=>centerMsg(t('newBest'),1600,true),900); if(li===LAPS-1) centerMsg(t('lastLap'),1800,true); }
}
function onPlayerFinish(){
  const p=G.player; p.auto=true; p.sk=SK.hard; p.lane=0;
  G.state='finished'; G.resT=1.3;
  const tid=G.track.def.id, b=best[tid]||(best[tid]={});
  const total=p.finishT, bl=Math.min.apply(null,p.laps);
  const ord=standings(); const pos=ord.indexOf(p)+1;
  let rec=false;
  if(G.mode==='race'){ const k='race'+G.diff; if(!b[k]||total<b[k]){ rec=!!b[k]||true; b[k]=total; } }
  else { if(!b.tt||total<b.tt){ rec=true; b.tt=total; } }
  store.set('best',best);
  G.result={pos,total,best:bl,laps:p.laps.slice(),rec:rec||G.newLapRec,stand:ord.map(c=>({name:c.name,me:c===p,t:c.finished?c.finishT:null})),mode:G.mode};
  FX.event('finish',pos);
}
function standings(){ return G.cars.slice().sort((a,b)=>(a.finished&&b.finished)?a.finishT-b.finishT:a.finished?-1:b.finished?1:b.dist-a.dist); }

function update(dt){
  G.time+=dt; const tr=G.track; if(!tr) return;
  if(G.state==='countdown'){
    G.countT-=dt; const n=Math.ceil(G.countT);
    if(n<G.lastBeep&&n>0){ G.lastBeep=n; centerMsg(String(n),900); AU.beep(false); }
    if(G.countT<=0){ G.state='race'; G.raceT=0; centerMsg('GO!',800); AU.beep(true); }
    return;
  }
  if(G.state==='race'||G.state==='finished'||G.state==='title'){
    G.raceT+=dt;
    for(const c of G.cars) stepCar(c,c.auto?aiControl(c):playerInput(dt),dt);
    resolveCars();
    const p=G.player, ps=segOf(p.z);
    G.bgOff+=ps.curve*p.speed*dt/SEG*.0016;
    if(G.state==='race'){
      const r=G.rec, lt=G.raceT-p.lapStartT;
      if(r&&lt>=r.d.length*.05&&r.d.length<6000){ r.d.push(Math.round(p.dist-p.lapsDone*tr.len)); r.x.push(Math.round(p.x*1000)); }
    }
    if(G.ghost&&G.state==='race'){ const gh=G.ghost, d=gh.data, lt=G.raceT-p.lapStartT, f=lt/d.dt, k=Math.floor(f);
      if(k<d.d.length-1){ const u=f-k; gh.dist=lerp(d.d[k],d.d[k+1],u)+p.lapsDone*tr.len; gh.x=lerp(d.x[k],d.x[k+1],u)/1000; gh.z=mod(gh.dist,tr.len); gh.vis=true; gh.steer=clamp((d.x[k+1]-d.x[k])/40,-1,1); }
      else gh.vis=false; }
    if(G.state==='finished'&&G.resT>0){ G.resT-=dt; if(G.resT<=0) showResult(); }
  }
}

/* ---------------- rendering ---------------- */
const cv=$('cv'), ctx=cv.getContext('2d',{alpha:false});
let VW=800,VH=600,RS=1,FOC=300,CY=300,skyC=null,skyKey='';
const QL=[{dpr:1,pix:520000,draw:110,part:.45,rain:50,lines:0,grid:0},{dpr:1.5,pix:1100000,draw:160,part:.75,rain:90,lines:1,grid:1},{dpr:2,pix:2300000,draw:220,part:1,rain:150,lines:1,grid:1}];
const coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
G.q=coarse?1:2;
const order=[], buckets=[];
for(let i=0;i<260;i++) buckets.push([]);
function project(p,wy,z,camX,camY,camZ){
  p.cz=z-camZ; p.scale=CAM_DEPTH/p.cz; p.sx=VW/2-p.scale*camX*FOC; p.sy=CY-p.scale*(wy-camY)*FOC; p.sw=p.scale*G.track.def.roadW*FOC;
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4); ctx.closePath(); ctx.fill(); }

  env(node,t0,a,peak,dec){ node.gain.setValueAtTime(0.0001,t0); node.gain.exponentialRampToValueAtTime(peak,t0+a); node.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec); },

  beep(go){ this.tone(go?880:440,go?.5:.18,'square',.18); if(go) this.tone(1320,.5,'triangle',.1); },
  hit(v){ this.nz(.25,'lowpass',900,.5*v); this.tone(120,.2,'sine',.4*v,40); },

  }
};

function shareURL(){

  const ref=document.referrer||'';
  if(framed){ try{ const u=new URL(ref); if(u.pathname&&u.pathname.length>1) return ref.split('#')[0]; }catch(e){}
    if(ARTIFACT_URL&&/claude|anthropic/i.test(location.hostname+' '+ref)) return ARTIFACT_URL; }
  if(location.protocol==='file:'&&ARTIFACT_URL) return ARTIFACT_URL;
  return here;
}

  if(e.target.closest&&(e.target.closest('#bPause')||e.target.closest('.screen'))) return;
  touch.ptr.set(e.pointerId,{act:btn?btn.dataset.act:'steer',btn,x:e.clientX});

  recomputeTouch(); e.preventDefault();

function layout(){
  const w=innerWidth, h=innerHeight;
  const racing=!$('hud').hidden;
  const portrait=h>w*1.08&&w<820&&racing;
  app.classList.toggle('portrait',portrait);
  VW=w; VH=portrait?Math.round(Math.min(h-210,w*1.3)):h;
  $('view').style.height=VH+'px'; app.style.setProperty('--vh',VH+'px');
  const q=QL[G.q]; let r=Math.min(window.devicePixelRatio||1,q.dpr); r=Math.min(r,Math.sqrt(q.pix/(VW*VH))); RS=Math.max(.5,r);
  cv.width=Math.round(VW*RS); cv.height=Math.round(VH*RS);
  FOC=Math.min(VW*.5,VH*.56); CY=VH-FOC-VH*.03;
  skyKey='';
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,200));

/* main loop with automatic quality drop */
let last=performance.now(), acc=0, perfT=0, perfN=0, perfAcc=0, qCool=4;
function frame(now){
  requestAnimationFrame(frame);
  let dtR=(now-last)/1000; last=now; if(!(dtR>0)) dtR=.016; dtR=Math.min(dtR,.1);
  if(!G.manual&&!G.paused){ acc+=dtR; let n=0; while(acc>=STEP&&n<14){ update(STEP); acc-=STEP; n++; } if(n>=14) acc=0; }
  if(tutT>=0){ tutT+=dtR; $('tutProg').style.width=Math.min(100,tutT/8*100)+'%'; if(tutT>=8) endTut(); }
  if(G.state==='title'&&!G.manual){ G.attractT+=dtR; if(G.attractT>15&&!$('scrTitle').hidden){ attract((G.attractI+1)%3); } }
  FX.dt=G.paused?0:dtR;
  if(!G.paused||G.needDraw){ render(); G.needDraw=false; }
  hudTick(false); drawMinimap(); AU.frame();
  if(!document.hidden&&!G.paused&&G.state!=='boot'){ perfAcc+=dtR; perfN++; qCool-=dtR;
    if(perfAcc>1.5){ const fps=perfN/perfAcc; G.fps=fps; if(fps<45&&G.q>0&&qCool<=0){ G.q--; qCool=3; layout(); } perfAcc=0; perfN=0; } }
}

/* test hooks for automated checks (no effect on normal play) */
window.__dp={G,TRACKS,CARS,SK,getTrack,setupField,startRace,update,render,standings,STEP,BASE,LAPS,showSetup,attract,setPause,layout,store,
  step(n){ for(let i=0;i<n;i++) update(STEP); },aiControl,keys,touch};

/* boot */
buildSprites(); FX.init();
applyLang(); layout();
attract(G.trackI);
showScreen('scrTitle');
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
